<!DOCTYPE html><html><head><title>QR Login</title><script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script></head><body style="text-align:center;font-family:sans-serif"><h2>QR দিয়ে Login করুন</h2><img id="qrImg" width="250"><p id="status">Loading...</p><script>const socket=io();let currentSessionId=null;async function loadQR(){const res=await fetch('/api/get-qr');const data=await res.json();currentSessionId=data.sessionId;document.getElementById('qrImg').src=data.qrImage;document.getElementById('status').innerText='Phone দিয়ে Scan করুন';socket.emit('join',currentSessionId);console.log("Session ID:",currentSessionId);}socket.on('loggedIn',(data)=>{document.getElementById('status').innerHTML='<h3 style=color:green>Login Success! Welcome '+data.user+'</h3>';});loadQR();</script></body></html>
