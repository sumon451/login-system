<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><title>Mobile Scanner</title><script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script><style>body{text-align:center;font-family:sans-serif}#reader{width:100%;max-width:350px;margin:auto;border:2px solid #25D366;border-radius:15px}</style></head><body><h2>Mobile Scanner</h2><div id="reader"></div><p id="status">Camera চালু হচ্ছে...</p><script>const status=document.getElementById('status');const html5QrCode=new Html5Qrcode("reader");function onScanSuccess(sessionId){html5QrCode.stop();status.innerHTML='QR পাওয়া গেছে: '+sessionId+'<br>Approve হচ্ছে...';fetch('/api/scan',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({sessionId,user:"OnePlus User"})}).then(()=>{status.innerHTML='<h3 style=color:green>Success! Web Login Done!</h3>';});}Html5Qrcode.getCameras().then(cameras=>{if(cameras.length){html5QrCode.start({facingMode:"environment"},{fps:10,qrbox:250},onScanSuccess);status.innerText="QR এর সামনে ক্যামেরা ধরো";}});</script></body></html>
