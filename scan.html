<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Login</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#f0f2f5}.card{background:white;padding:30px;border-radius:15px;width:90%;max-width:350px;box-shadow:0 4px 20px rgba(0,0,0,0.1);text-align:center}input{width:90%;padding:12px;margin:10px 0;border-radius:8px;border:1px solid #ccc}button{width:95%;padding:12px;background:#1877f2;color:white;border:none;border-radius:8px;font-size:16px}</style></head><body><div class="card"><h3>লগইন করুন</h3><p>মোবাইল নাম্বার দিন</p><input id="phone" type="tel" placeholder="01XXXXXXXXX"><button onclick="approve()">Confirm Login</button><p id="msg"></p></div><script>const SUPABASE_URL="https://clmevhlhopzxtvmxjkkkl.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNsbWV2aGxob3B6eHR2bXhqa2tsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3NjU2NDksImV4cCI6MjEwNTM0MTY0OX0.6A5id4_DLDUvyyhS_sS3AG3Ycg-BaoXmORtfQ4NHXYw";const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);const urlParams=new URLSearchParams(window.location.search);const sessionId=urlParams.get('id');async function approve(){const phone=document.getElementById('phone').value;if(!phone){alert('নাম্বার দিন');return;}if(!sessionId){alert('QR ID পাওয়া যায়নি');return;}const{error}=await supabaseClient.from('qr_sessions').update({status:'approved',user_phone:phone}).eq('id',sessionId);if(error){document.getElementById('msg').innerText=error.message;}else{document.getElementById('msg').innerText='✅ সফল! এখন ল্যাপটপে দেখুন';}}</script></body></html>
