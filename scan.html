<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Login Confirm</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script><style>body{font-family:sans-serif;display:flex;justify-content:center;align-items:center;height:100vh;background:#eef2f7;margin:0}.card{background:#fff;padding:30px;border-radius:15px;text-align:center;width:320px}input{padding:14px;width:90%;border-radius:10px;border:1px solid #ccc}button{padding:14px;width:100%;background:#25D366;color:#fff;border:none;border-radius:10px;margin-top:15px;font-size:16px}</style></head><body><div class="card"><h3>এই ডিভাইসে লগইন করবেন?</h3><input id="phone" placeholder="আপনার নাম"><button onclick="approve()">Confirm Login</button><div id="msg" style="margin-top:15px"></div></div><script>
